name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint · Typecheck · Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint (zero errors enforced)
        run: bun run lint

      - name: Typecheck (strict, zero errors enforced)
        run: bun run typecheck

      - name: Production build
        env:
          # The build must never require secrets — every feature degrades
          # gracefully at runtime when services are unconfigured.
          NEXT_PUBLIC_APP_URL: http://localhost:3000
        run: bun run build
